name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run fix-screens script
        run: node scripts/fix-screens.js || true

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean --no-install
        env:
          REGISTER_FILE: ./registers/aiims-delhi.register.json
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Patch MainApplication.kt
        run: |
          MAIN_KT=$(find android/app/src/main -name "MainApplication.kt" | head -1)
          # Keep the package line exactly as Expo wrote it: `in` is a Kotlin
          # keyword, so the generated file has it backtick-escaped.
          PKG=$(grep "^package " "$MAIN_KT" | sed 's/^package //')
          echo "Package: [$PKG]"
          python3 scripts/patch-main-application.py "$MAIN_KT" "$PKG"
          echo "--- MainApplication.kt after patch ---"
          cat "$MAIN_KT"

      - name: Patch gradle.properties
        run: |
          if grep -q "^newArchEnabled" android/gradle.properties; then
            sed -i 's/^newArchEnabled=.*/newArchEnabled=false/' android/gradle.properties
          else
            echo "newArchEnabled=false" >> android/gradle.properties
          fi
          if grep -q "^bundleInDebug" android/gradle.properties; then
            sed -i 's/^bundleInDebug=.*/bundleInDebug=true/' android/gradle.properties
          else
            echo "bundleInDebug=true" >> android/gradle.properties
          fi
          echo "--- gradle.properties after patch ---"
          cat android/gradle.properties

      - name: Build debug APK
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -50
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Verify JS bundle in APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          echo "APK size: $(du -h $APK | cut -f1)"
          unzip -l "$APK" | grep -E "assets/index|bundle" || echo "WARNING: no JS bundle found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aiims-delhi-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
