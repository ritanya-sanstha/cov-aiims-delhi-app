name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run fix-screens script (skip patch-package in CI)
        run: node scripts/fix-screens.js || true

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean --no-install
        env:
          REGISTER_FILE: ./registers/aiims-delhi.register.json
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Pin Gradle to 8.8 (RN 0.79 requires Gradle 8.x not 9.x)
        run: |
          sed -i 's|gradle-[0-9.]*-bin.zip|gradle-8.8-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's|gradle-[0-9.]*-all.zip|gradle-8.8-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          echo "--- gradle-wrapper.properties ---"
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Ensure newArchEnabled=false in gradle.properties
        run: |
          if grep -q "^newArchEnabled" android/gradle.properties; then
            sed -i 's/^newArchEnabled=.*/newArchEnabled=false/' android/gradle.properties
          else
            echo "newArchEnabled=false" >> android/gradle.properties
          fi
          grep -i "arch" android/gradle.properties || true

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aiims-delhi-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
