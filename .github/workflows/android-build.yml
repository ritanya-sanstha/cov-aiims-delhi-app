name: Android APK Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - run: yes | sdkmanager --licenses || true
        env: { ANDROID_SDK_ROOT: /usr/local/lib/android/sdk }
      - run: npm ci --legacy-peer-deps
      - run: node scripts/fix-screens.js || true
      - run: npx expo prebuild --platform android --clean --no-install
        env: { REGISTER_FILE: ./registers/aiims-delhi.register.json, ANDROID_SDK_ROOT: /usr/local/lib/android/sdk }
      - run: cat android/gradle/wrapper/gradle-wrapper.properties
      - name: Pin react-android version explicitly (Gradle 9.x BOM workaround)
        run: |
          RN_VERSION=$(node -p "require('./node_modules/react-native/package.json').version")
          echo "React Native version: $RN_VERSION"
          sed -i "s/implementation(\"com.facebook.react:react-android\")/implementation(\"com.facebook.react:react-android:${RN_VERSION}\")/" android/app/build.gradle
          echo "--- app/build.gradle react-android line ---"
          grep "react-android" android/app/build.gradle || echo "WARNING: react-android not found!"
      - run: |
          if grep -q "^newArchEnabled" android/gradle.properties; then
            sed -i 's/^newArchEnabled=.*/newArchEnabled=false/' android/gradle.properties
          else
            echo "newArchEnabled=false" >> android/gradle.properties
          fi
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        env: { ANDROID_SDK_ROOT: /usr/local/lib/android/sdk }
      - uses: actions/upload-artifact@v4
        with: { name: "aiims-delhi-apk-${{ github.run_number }}", path: android/app/build/outputs/apk/debug/app-debug.apk, retention-days: 30 }
