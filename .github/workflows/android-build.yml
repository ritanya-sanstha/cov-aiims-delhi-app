name: Android APK Build

# Builds an installable release APK straight from Expo's generated Android
# project. No source patching: package.json pins one consistent Expo SDK (53)
# so Expo's own native code matches the React Native version. If a build
# breaks, fix package.json / app.config.js, do not add patch steps here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Apply register branding (logo)
        run: node scripts/apply-branding.js
        env:
          REGISTER_FILE: ./registers/aiims-delhi.register.json

      - name: Type check
        run: npx tsc --noEmit

      - name: Expo prebuild (generate Android project)
        run: npx expo prebuild --platform android --clean --no-install
        env:
          REGISTER_FILE: ./registers/aiims-delhi.register.json

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
        shell: bash
        env:
          REGISTER_FILE: ./registers/aiims-delhi.register.json

      - name: Verify APK contents
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::APK not found"; exit 1; }
          echo "APK size: $(du -h "$APK" | cut -f1)"
          LIST=$(unzip -l "$APK")
          # RN 0.79 merges its native libs into libreactnative.so (OpenSourceMergedSoMapping)
          for f in assets/index.android.bundle libhermes libreactnative.so; do
            echo "$LIST" | grep -q "$f" || { echo "::error::missing $f in APK"; exit 1; }
          done
          echo "JS bundle, Hermes and React Native native libs present."

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: /tmp/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aiims-delhi-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Releases (archive of this build + latest link)
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          N=${{ github.run_number }}
          # 1. Archive: one release per build, kept until someone deletes it
          #    (gh release delete build-N --cleanup-tag). Never replaced by later builds.
          cp "$APK" "aiims-delhi-build-$N.apk"
          gh release create "build-$N" "aiims-delhi-build-$N.apk" \
            --target "$GITHUB_SHA" \
            --title "Build #$N" \
            --notes "Android APK. Build $N, commit ${GITHUB_SHA::7}, $(date -u +%Y-%m-%d\ %H:%M) UTC." \
            --latest=false || echo "::warning::archive release build-$N was not created (already exists?); continuing"
          # 2. Moving pointer: the newest build at a stable link
          gh release delete latest-build --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-build "$APK" \
            --title "Latest Build (#$N)" \
            --notes "Android APK. Build $N, commit ${GITHUB_SHA::7}. Every build is kept as release build-$N." \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
