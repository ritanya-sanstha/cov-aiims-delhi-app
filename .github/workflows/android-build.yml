name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: yes | sdkmanager --licenses || true
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      - run: npm ci --legacy-peer-deps
      - run: node scripts/fix-screens.js || true
      - run: sed -i "s/'jsc'/'hermes'/" app.config.js && echo "Build 18 - release APK to fix crash"
      - run: npx expo prebuild --platform android --clean --no-install
        env:
          REGISTER_FILE: ./registers/aiims-delhi.register.json
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      - run: cat android/gradle/wrapper/gradle-wrapper.properties
      - name: Pin react-android and hermes-android versions (Gradle 9.x BOM workaround)
        run: |
          sed -i 's/implementation("com.facebook.react:react-android")/implementation("com.facebook.react:react-android:0.79.0")/g' android/app/build.gradle
          sed -i 's/implementation("com.facebook.react:hermes-android")/implementation("com.facebook.react:hermes-android:0.79.0")/g' android/app/build.gradle
          echo "--- react-native deps in app/build.gradle ---"
          grep -E "react-android|hermes-android" android/app/build.gradle || echo "WARNING: not found!"
      - name: Patch MainApplication.kt and set getUseDeveloperSupport=false
        run: |
          MAIN_KT=$(find android/app/src/main -name "MainApplication.kt" | head -1)
          echo "=== ORIGINAL MainApplication.kt ==="
          cat "$MAIN_KT"
          PKG=$(grep "^package " "$MAIN_KT" | sed 's/^package //')
          echo "=== Package: [$PKG] ==="
          python3 scripts/patch-main-application.py "$MAIN_KT" "$PKG"
          echo "=== PATCHED MainApplication.kt ==="
          cat "$MAIN_KT"
      - run: |
          if grep -q "^newArchEnabled" android/gradle.properties; then
            sed -i 's/^newArchEnabled=.*/newArchEnabled=false/' android/gradle.properties
          else
            echo "newArchEnabled=false" >> android/gradle.properties
          fi
      - name: Patch expo-modules-core NativeStatePropsGetter.cpp for RN 0.79 API change
        run: |
          python3 -c "
          f = 'node_modules/expo-modules-core/android/src/main/cpp/fabric/NativeStatePropsGetter.cpp'
          c = open(f).read()
          old = 'state->updateState(std::move(newState), react::EventQueue::UpdateMode::unstable_Immediate);'
          new_str = 'state->updateState(std::move(newState));'
          n = c.count(old)
          open(f, 'w').write(c.replace(old, new_str))
          print(str(n) + ' occurrence(s) patched')
          "
      - name: Configure release signing with generated keystore
        run: |
          keytool -genkey -v -keystore /tmp/aiims-release.keystore -alias app -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=AIIMS Delhi App,O=Ritanya Sanstha,C=IN"
          echo "Keystore generated at /tmp/aiims-release.keystore"
          python3 scripts/configure-release-signing.py /tmp/aiims-release.keystore
          grep -A8 "release {" android/app/build.gradle | head -25
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      - uses: actions/upload-artifact@v4
        with:
          name: "aiims-delhi-apk-${{ github.run_number }}"
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Publish GitHub Release (public download link)
        if: success()
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK_PATH"
          gh release delete "latest-build" --yes 2>/dev/null || true
          gh release create "latest-build" "$APK_PATH" \
            --title "Latest Build (#${{ github.run_number }})" \
            --notes "Android APK - download and install on your device. Build ${{ github.run_number }}." \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
